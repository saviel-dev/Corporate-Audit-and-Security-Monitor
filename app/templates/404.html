<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ _('Página no encontrada') }} - Corporate Monitor" />
  <title>404 — {{ _('Página no encontrada') }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}?v=2" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('theme-light');
    }
  </script>

  <style>
    body.error-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-base);
      padding: 20px;
      margin: 0;
    }
    .error-container {
      width: 100%;
      max-width: 500px;
      text-align: center;
      opacity: 0;
      animation: fadeInSlideUp 0.6s var(--ease) forwards;
    }
    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .error-icon {
      width: 80px;
      height: 80px;
      color: var(--brand);
      opacity: 0.8;
    }
    .error-code {
      font-size: 4rem;
      font-weight: 800;
      color: var(--text-primary);
      margin: 0;
      line-height: 1;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }
    .error-message {
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0;
      font-size: 0.95rem;
      max-width: 360px;
    }
    .btn-home {
      margin-top: 12px;
      padding: 12px 24px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body class="error-body">
  <div class="error-container">
    <div class="error-card">
      <i data-lucide="file-question" class="error-icon"></i>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">{{ _('Página no encontrada') }}</h2>
      <p class="error-message">
        {{ _('Lo sentimos, pero la página o el archivo que buscas no existe o ha sido movido.') }}
      </p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-home">
        <i data-lucide="arrow-left"></i>
        {{ _('Volver al Dashboard') }}
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
